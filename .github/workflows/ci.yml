name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [lookup, owner, holder]
    defaults:
      run:
        working-directory: packages/${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/${{ matrix.pkg }}/package-lock.json
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Audit (critical blocks)
        run: npm audit --audit-level=critical
      - name: Build (tsc)
        run: npm run build

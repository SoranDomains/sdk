name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [lookup, owner, holder, mcp]
    defaults:
      run:
        working-directory: packages/${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/${{ matrix.pkg }}/package-lock.json
      - name: Install from lockfile
        run: npm ci
      - name: Audit critical vulnerabilities
        run: npm audit --audit-level=critical
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Browser compatibility
        if: matrix.pkg != 'mcp'
        run: npm run check:browser

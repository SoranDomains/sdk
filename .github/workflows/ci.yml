name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Audit (critical blocks)
        run: npm audit --audit-level=critical
      - name: Build (tsc)
        run: npm run build
